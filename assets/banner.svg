<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#161210"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0A519"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#F0A519"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset="0.5" stop-color="white" stop-opacity="0.18"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" fill="url(#bg)" rx="20"/>

  <!-- animated grid -->
  <g opacity="0.07" stroke="#F0A519" stroke-width="1">
    <path d="M0 40h900M0 80h900M0 120h900M0 160h900M0 200h900"/>
    <path d="M60 0v220M180 0v220M300 0v220M420 0v220M540 0v220M660 0v220M780 0v220"/>
  </g>

  <!-- moving shine sweep -->
  <g>
    <rect x="-300" y="0" width="300" height="220" fill="url(#shine)">
      <animate attributeName="x" from="-300" to="900" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- glow orb -->
  <circle cx="450" cy="110" r="90" fill="#F0A519" opacity="0.05">
    <animate attributeName="r" values="80;100;80" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- name -->
  <text x="450" y="78" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-size="58" font-weight="900" fill="url(#gold)" filter="url(#glow)" letter-spacing="4">
    ANZAR MIFTA
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- role line -->
  <text x="450" y="116" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#c9d1d9" letter-spacing="6">
    WEB &#8226; AI &#8226; AUTOMATION CONSULTANT
  </text>

  <!-- underline pulse -->
  <rect x="280" y="134" width="340" height="3" rx="1.5" fill="url(#gold)">
    <animate attributeName="width" values="120;340;120" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x" values="390;280;390" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- tagline -->
  <text x="450" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e" letter-spacing="2">
    I build platforms that run themselves.
  </text>

  <!-- corner ticks -->
  <g stroke="#F0A519" stroke-width="2" opacity="0.7">
    <path d="M16 16h34M16 16v34"/>
    <path d="M884 16h-34M884 16v34"/>
    <path d="M16 204h34M16 204v-34"/>
    <path d="M884 204h-34M884 204v-34"/>
  </g>
</svg>
